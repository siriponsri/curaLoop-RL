[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curaloop-rl"
version = "0.1.0"
description = "Offline pharmaceutical screening decision simulator with private delayed assay feedback"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2",
  "streamlit>=1.40,<2", "altair>=5,<7",
  "gymnasium>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4,<5", "ruff>=0.8,<1", "build>=1,<2", "httpx>=0.27,<1"]
chemistry = ["rdkit>=2024.3,<2027"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
curaloop = "curaloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
curaloop = ["resources/*.json", "resources/*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

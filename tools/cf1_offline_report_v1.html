const text={en:{tag:'Retrospective development study · Offline report',title:'What can a fixed confirmation budget recover?',intro:'Published processed-repository evidence for source-positive hits (H) and operational structure-group coverage (D). All six rankers receive the same three portfolio operators. No new selector was trained.',campaigns:'Development campaigns',observations:'Observed primary-hit confirmations',cells:'Verified comparison cells',arms:'Fixed baseline arms',view:'Campaign view',budget:'Budget (% of supported universe)',caption:'Mean across five seeds; brackets show the observed seed range. Higher H and D are better.',ranker:'Ranker',operator:'Portfolio operator',variation:'H: source-confirmed positives. D: positive Murcko/acyclic-fallback groups. D (FP): fixed Tanimoto-leader sensitivity. H/B and D/B: counts per confirmation. Seed ranges describe algorithm/tie variation, not biological population uncertainty.',boundary:'Evidence boundary',limits:'This is a reproduction of a pinned processed repository, not raw-assay equivalence or an independent final test. The six campaigns span four provider blocks and one annotation-connected component. Missing confirmation is excluded; source 0 includes inactive or inconclusive. No whole-library, chemical-OOD, clinical or monetary-saving claim is supported.',offline:'Offline handoff only. This report is separate from the live simulator and does not connect to laboratory or team tools. Final16 remains sealed. Owner review is required before any new method or independent evaluation.',download:'Download all 2,700 aggregate cells',all:'All six campaigns (equal weight)',top_ranked:'Top-ranked',cluster_round_robin:'Cluster round-robin',classical_max_min:'Classical max-min',globalContext:'Each campaign has equal weight. Confirmation counts differ by campaign. The 10% example is descriptive; all five budgets are available.',u:'Supported universe',b:'Confirmations per seed/arm'},th:{tag:'การศึกษาย้อนหลังบนชุดพัฒนา · ร

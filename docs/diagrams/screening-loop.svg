<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 792" role="img" aria-labelledby="screening-loop-title screening-loop-desc" id="screening-loop-root"><title id="screening-loop-title">From candidates to traceable evidence</title><desc id="screening-loop-desc">Observe public state, select candidates, reserve resources, wait for due feedback, deliver outcomes and update decisions; every pass contributes to the public event ledger.</desc><defs>
      <style>#screening-loop-root { font-family: Segoe UI,Arial,sans-serif; color: #16333B; }
      #screening-loop-root .diagram-container { width:100%;overflow-x:auto }
      #screening-loop-root .diagram-container { overflow-x:visible }
      #screening-loop-root .source-note { display:none }</style><marker id="screening-loop-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#526653"/></marker><marker id="screening-loop-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#087F72"/></marker></defs><rect width="1120" height="792" fill="#F7F9F8" rx="12"/><text x="64" y="40" font-family="Consolas,monospace" font-size="11" font-weight="600" fill="#087F72" text-anchor="start">CURALOOP-RL / RESEARCH WORKBENCH</text><text x="64" y="88" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="600" fill="#16333B" text-anchor="start">From candidates to traceable evidence</text><text x="64" y="120" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526653" text-anchor="start">An auditable screening cycle with delayed feedback and bounded resources.</text><path d="M656.000 196.036A240 240 0 0 1 737.546 254.515" fill="none" stroke="#526653" stroke-width="2" marker-end="url(#screening-loop-muted)"/><path d="M786.274 336.000A240 240 0 0 1 786.933 494.112" fill="none" stroke="#526653" stroke-width="2" marker-end="url(#screening-loop-muted)"/><path d="M738.885 576.000A240 240 0 0 1 657.830 635.156" fill="none" stroke="#526653" stroke-width="2" marker-end="url(#screening-loop-muted)"/><path d="M464.000 635.964A240 240 0 0 1 382.454 577.485" fill="none" stroke="#087F72" stroke-width="2" marker-end="url(#screening-loop-teal)"/><path d="M333.726 496.000A240 240 0 0 1 333.067 337.888" fill="none" stroke="#526653" stroke-width="2" marker-end="url(#screening-loop-muted)"/><path d="M381.115 256.000A240 240 0 0 1 462.170 196.844" fill="none" stroke="#526653" stroke-width="2" marker-end="url(#screening-loop-muted)"/><path d="M560.000 352.000L560.000 216.000" fill="none" stroke="#526653" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#screening-loop-muted)"/><path d="M698.718 496.000L663.923 476.000" fill="none" stroke="#526653" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#screening-loop-muted)"/><path d="M560.000 616.000L560.000 480.000" fill="none" stroke="#526653" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#screening-loop-muted)"/><path d="M421.282 496.000L456.077 476.000" fill="none" stroke="#526653" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#screening-loop-muted)"/><rect x="448" y="360" width="224" height="112" rx="8" fill="#E6F3EB" stroke="#087F72" stroke-width="1.5"/><text x="560" y="392" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#087F72" text-anchor="middle">PUBLIC EVIDENCE</text><text x="560" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#16333B" text-anchor="middle">Event ledger</text><text x="560" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#526653" text-anchor="middle">Metrics / budgets / revisions</text><rect x="464" y="136" width="192" height="80" rx="8" fill="#FFFFFF" stroke="#B5C7BF" stroke-width="1.5"/><text x="480" y="159" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#526653" text-anchor="start">01</text><text x="480" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#16333B" text-anchor="start">Observe</text><text x="480" y="203" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#526653" text-anchor="start">Public descriptors and labels</text><rect x="672" y="256" width="192" height="80" rx="8" fill="#FFFFFF" stroke="#B5C7BF" stroke-width="1.5"/><text x="688" y="279" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#526653" text-anchor="start">02</text><text x="688" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#16333B" text-anchor="start">Select</text><text x="688" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#526653" text-anchor="start">A policy proposes candidates</text><rect x="672" y="496" width="192" height="80" rx="8" fill="#FFFFFF" stroke="#B5C7BF" stroke-width="1.5"/><text x="688" y="519" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#526653" text-anchor="start">03</text><text x="688" y="542" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#16333B" text-anchor="start">Reserve</text><text x="688" y="563" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#526653" text-anchor="start">Accept once; reserve budget</text><rect x="464" y="616" width="192" height="80" rx="8" fill="#FFFFFF" stroke="#B5C7BF" stroke-width="1.5"/><text x="480" y="639" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#526653" text-anchor="start">04</text><text x="480" y="662" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#16333B" text-anchor="start">Wait</text><text x="480" y="683" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#526653" text-anchor="start">Configured feedback delay</text><rect x="256" y="496" width="192" height="80" rx="8" fill="#E6F3EB" stroke="#087F72" stroke-width="1.5"/><text x="272" y="519" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#087F72" text-anchor="start">05</text><text x="272" y="542" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#16333B" text-anchor="start">Deliver</text><text x="272" y="563" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#526653" text-anchor="start">Active / inactive / missing</text><rect x="256" y="256" width="192" height="80" rx="8" fill="#FFFFFF" stroke="#B5C7BF" stroke-width="1.5"/><text x="272" y="279" font-family="Consolas,monospace" font-size="10" font-weight="600" fill="#526653" text-anchor="start">06</text><text x="272" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#16333B" text-anchor="start">Update</text><text x="272" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#526653" text-anchor="start">Use newly delivered labels</text><text x="64" y="750" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#526653" text-anchor="start">Solid: next step. Dashed: record accepted actions and due results; read public state.</text><text x="64" y="774" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#526653" text-anchor="start">Repeat while budget and candidates permit. Pending predictions and seed hits are not new confirmed hits.</text></svg>

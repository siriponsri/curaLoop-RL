const text={en:{tag:'Retrospective development study · Offline report',title:'What can a fixed confirmation budget recover?',intro:'Published processed-repository evidence for source-positive hits (H) and operational structure-group coverage (D). All six rankers receive the same three portfolio operators. No new selector was trained.',campaigns:'Development campaigns',observations:'Observed primary-hit confirmations',cells:'Verified comparison cells',arms:'Fixed baseline arms',view:'Campaign view',budget:'Budget (% of supported universe)',caption:'Mean across five seeds; brackets show the observed seed range. Higher H and D are better.',ranker:'Ranker',operator:'Portfolio operator',variation:'H: source-confirmed positives. D: positive Murcko/acyclic-fallback groups. D (FP): fixed Tanimoto-leader sensitivity. H/B and D/B: counts per confirmation. Seed ranges describe algorithm/tie variation, not biological population uncertainty.',boundary:'Evidence boundary',limits:'This is a reproduction of a pinned processed repository, not raw-assay equivalence or an independent final test. The six campaigns span four provider blocks and one annotation-connected component. Missing confirmation is excluded; source 0 includes inactive or inconclusive. No whole-library, chemical-OOD, clinical or monetary-saving claim is supported.',offline:'Offline handoff only. This report is separate from the live simulator and does not connect to laboratory or team tools. Final16 remains sealed. Owner review is required before any new method or independent evaluation.',download:'Download all 2,700 aggregate cells',all:'All six campaigns (equal weight)',top_ranked:'Top-ranked',cluster_round_robin:'Cluster round-robin',classical_max_min:'Classical max-min',globalContext:'Each campaign has equal weight. Confirmation counts differ by campaign. The 10% example is descriptive; all five budgets are available.',u:'Supported universe',b:'Confirmations per seed/arm'},th:{tag:'การศึกษาย้อนหลังบนชุดพัฒนา · ร let lang='en';const ranks=['random','primary_score','mvsa','gbm','rf','nearest_primary'],names=['Random','Primary Score','MVS-A','GBM','RF','Nearest primary hit'],ops=['top_ranked','cluster_round_robin','classical_max_min'];
function render(){document.documentElement.lang=lang;const t=text[lang],chosen=document.querySelector('#campaign').value||'all';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t[e.dataset.i]);document.querySelector('#language').textContent=lang==='en'?'ภาษาไทย':'English';const select=document.querySelector('#campaign');select.replaceChildren();for(const [value,label]of [['all',t.all],...data.campaigns.map(c=>[c.campaign,c.campaign])]){const option=new Option(label,value);select.add(option)}select.value=chosen;const percent=+document.querySelector('#budget').value;let rows=chosen==='all'?data.global:data.rows.filter(r=>r.campaign===chosen);rows=rows.filter(r=>+r.budget_percent===percent);const body=document.querySelector('#values');body.replaceChildren();for(const rank of ranks)for(const op of ops){const r=rows.find(v=>v.ranker===rank&&v.operator===op);if(!r)throw Error('Missing frozen arm');const tr=document.createElement('tr');if(op===ops[0])tr.className='group';const values=[names[ranks.indexOf(rank)],t[op],...['confirmed_positives','positive_structure_groups','positive_fingerprint_groups'].map(m=>`${(+r[m+'_mean']).toFixed(1)} [${(+r[m+'_min']).toFixed(1)}, ${(+r[m+'_max']).toFixed(1)}]`),...['hits_per_confirmation','groups_per_confirmation'].map(m=>(+r[m+'_mean']*100).toFixed(1)+'%')];values.forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.append(td)});body.append(tr)}let note=t.globalContext;if(chosen!=='all'){const c=data.campaigns.find(c=>c.campaign===chosen);note=`${t.u}: ${c.universe_size.toLocaleString()}. ${t.b}: ${rows[0].confirmation_count}.`}document.querySelector('#context').textContent=note}
document.querySelector('#language').addEventListener('click',()=>{lang=lang==='en'?'th':'en';render()});document.querySelector('#campaign').addEventListener('change',render);document.querySelector('#budget').addEventListener('change',render);render();
